# railway.toml — set service root directory to /erp in Railway dashboard
# Docs: https://docs.railway.com/guides/monorepo

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/health"
healthcheckTimeout = 300
